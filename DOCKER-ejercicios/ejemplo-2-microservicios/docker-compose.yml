version: '3.8'

services:
  # Reverse Proxy / Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - public-network
    depends_on:
      - frontend
      - api-gateway
    restart: unless-stopped

  # Frontend - React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    environment:
      - REACT_APP_API_URL=http://localhost:4000
    networks:
      - public-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - USERS_SERVICE_URL=http://users-service:4002
      - PRODUCTS_SERVICE_URL=http://products-service:4003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - public-network
      - app-network
    depends_on:
      - auth-service
      - users-service
      - products-service
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - NODE_ENV=production
      - PORT=4001
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRATION=24h
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - app-network
    depends_on:
      - redis
    restart: unless-stopped

  # Users Service
  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: users-service
    environment:
      - NODE_ENV=production
      - PORT=4002
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=usersapp
      - DB_PASSWORD=userspass
      - DB_NAME=usersdb
    networks:
      - app-network
      - db-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Products Service
  products-service:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    container_name: products-service
    environment:
      - NODE_ENV=production
      - PORT=4003
      - MONGODB_URI=mongodb://mongodb:27017/productsdb
    networks:
      - app-network
      - db-network
    depends_on:
      - mongodb
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=usersdb
      - MYSQL_USER=usersapp
      - MYSQL_PASSWORD=userspass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./users-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: mongodb
    environment:
      - MONGO_INITDB_DATABASE=productsdb
    volumes:
      - mongo-data:/data/db
    networks:
      - db-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: redis-cache
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  public-network:
    driver: bridge
  app-network:
    driver: bridge
    internal: true
  db-network:
    driver: bridge
    internal: true

volumes:
  mysql-data:
  mongo-data:
  redis-data:
